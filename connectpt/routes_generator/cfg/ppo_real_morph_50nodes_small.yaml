ppo:
  n_iterations: 25
  val_period: 5
  n_epochs: 1
  minibatch_size: 16
  horizon: 120
  epsilon: 0.2
  use_gae: true
  gae_lambda: 0.95

discount_rate: 0.95
diff_reward: true
baseline_lr: 0.0005
entropy_weight: 0.0
batch_size: 16
reward_scale: 1.0
lr: 0.0016134816080499328
decay: 0.0008404361781997002
optimizer: Adam

eval:
  min_route_len: 2
  max_route_len: 12
  n_routes: 10

dataset:
  type: pickle
  kwargs:
    path: ${oc.env:SUPER_DUPER_DISSER_ROOT,/Users/gk/Code/super-duper-disser}/connectpt/datasets/real_morph_50nodes_local
    space_scale: 0.2
    demand_scale: 0.2

outdir: ${oc.env:SUPER_DUPER_DISSER_ROOT,/Users/gk/Code/super-duper-disser}/connectpt/model_weights/real_morph_50nodes_small

defaults:
  - _self_
  - experiment: standard
  - model: bestsofar_feb2023
